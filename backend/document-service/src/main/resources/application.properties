# ??? Server ???????????????????????????????????????????
server.port=8083

# ??? Database ?????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${APP_DB_PORT:5433}/${APP_DB_NAME:alten_copilot}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ??? JPA / Hibernate ??????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ??? File Upload ??????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
document.upload.path=uploads/documents

# ??? App name ?????????????????????????????????????????
spring.application.name=document-service

# ??? RAG Service URL ??????????????????????????????????
rag.service.url=${RAG_SERVICE_URL:http://localhost:8085}

# ??? JWT ??????????????????????????????????????????????
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ??? Swagger ??????????????????????????????????????????
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.try-it-out-enabled=true