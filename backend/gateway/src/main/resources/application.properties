# =============================================================================
# Gateway - single entry point for the frontend.
# All secrets come from the repo-root .env (exported by ./dev.sh).
# =============================================================================

# --- Server ------------------------------------------------------------------
server.port=8080
spring.application.name=gateway

# --- Routes ------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=${USER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[2].id=document-service
spring.cloud.gateway.server.webflux.routes[2].uri=${DOCUMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/documents/**

spring.cloud.gateway.server.webflux.routes[3].id=chat-service
spring.cloud.gateway.server.webflux.routes[3].uri=${CHAT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/chat/**

# Tickets also live in chat-service. This route was missing, so every
# /api/tickets/** call 404'd at the gateway - it only ever worked because the
# Angular app called chat-service directly on :8084.
spring.cloud.gateway.server.webflux.routes[4].id=chat-service-tickets
spring.cloud.gateway.server.webflux.routes[4].uri=${CHAT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/tickets/**

# Ticket attachments, served as static files by chat-service (WebConfig).
# Whitelisted in JwtAuthenticationFilter: a browser loading <img src="/uploads/...">
# cannot attach an Authorization header.
spring.cloud.gateway.server.webflux.routes[5].id=chat-service-uploads
spring.cloud.gateway.server.webflux.routes[5].uri=${CHAT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/uploads/**

# --- JWT ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET}

# --- CORS --------------------------------------------------------------------
# In development the Angular dev-server proxies /api and /uploads (see
# frontend/proxy.conf.json), so requests are same-origin and CORS never applies.
# This block matters for any non-proxied client.
# PATCH is required by PATCH /api/tickets/{id}/status and was previously absent.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
