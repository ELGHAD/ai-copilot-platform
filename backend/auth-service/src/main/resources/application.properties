# ??? Server ???????????????????????????????????????????
server.port=8081

# ??? Database ?????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${APP_DB_PORT:5433}/${APP_DB_NAME:alten_copilot}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ??? JPA / Hibernate ??????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Removes dialect warning ? Spring Boot auto-detects PostgreSQL
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Removes open-in-view warning ? we are stateless REST, no view rendering
spring.jpa.open-in-view=false

# ??? App name ?????????????????????????????????????????
spring.application.name=auth-service

# ??? JWT ??????????????????????????????????????????????
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ??? Swagger ??????????????????????????????????????????
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.try-it-out-enabled=true