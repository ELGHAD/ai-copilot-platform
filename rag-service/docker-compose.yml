services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-rag
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hamza
      POSTGRES_DB: rag_db
    ports:
      - "5435:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
